const WWS_TIERS=[
  {min:80,label:"Flourishing",desc:"Your scores reflect strong overall wellbeing across most dimensions.",cls:"0"},
  {min:65,label:"Functional Wellness",desc:"You are managing well, with some areas that may benefit from attention.",cls:"0"},
  {min:50,label:"Emerging Distress",desc:"Several domains show patterns that warrant focused attention and support.",cls:"1"},
  {min:35,label:"Significant Impairment",desc:"Multiple domains reflect meaningful distress. Professional support is strongly encouraged.",cls:"2"},
  {min:0,label:"Acute Clinical Need",desc:"Your responses indicate significant difficulty across multiple domains. Please connect with a licensed provider.",cls:"3"},
];

const SEV_LABELS=[["Minimal","Low burden"],["Mild","Some concern"],["Moderate","Notable burden"],["Significant","High burden"]];

const answers={};
let curSec=-1,timerInt=null,elapsed=0;

// ── Proxy URL — replace with your Vercel deployment URL ───────────────────
// Example: "https://waam-proxy.vercel.app/api/waam"
const WAAM_PROXY_URL="https://vercel-proxy-web-dev2.vercel.app/api/waam";

function startTimer(){
  timerInt=setInterval(()=>{elapsed++;},1000);
}

function updateProg(){
  const pct=curSec<0?0:Math.round(((curSec+1)/DOMAINS.length)*100);
  document.getElementById("waamProgFill").style.width=pct+"%";
}

function render(){
  updateProg();
  if(curSec===-1){renderIntro();}
  else if(curSec>=DOMAINS.length){renderResults();}
  else{renderSec(DOMAINS[curSec]);}
}

function renderIntro(){
  document.getElementById("waamMain").innerHTML=`
  <div class="intro">
    <div class="intro-chip">&#9201; Estimated time: 12–15 minutes</div>
    <h1 class="intro-title">WAAM&#8482; — <em>Wholistically Aligned</em><br>Assessment Method</h1>
    <p class="intro-sub">A proprietary, AI-driven multi-domain wellness assessment developed under board-certified PMHNP clinical oversight. Your responses generate a personalized WAAM&#8482; Clinical Engine&#8482; analysis across seven dimensions of mental and physical wellbeing.</p>
    <div class="domain-grid">${DOMAINS.filter(d=>d.id!=="CX").map(d=>`<div class="domain-chip"><span class="domain-chip-icon">${d.icon}</span><div class="domain-chip-name">${d.name}</div><div class="domain-chip-abbr">WAAM-${d.abbr}&#8482;</div></div>`).join("")}</div>
    <div class="notice"><strong>&#9888; Educational Notice:</strong> WAAM&#8482; is developed under PMHNP clinical oversight for educational and wellness purposes. Results are not a clinical diagnosis and do not establish a provider-patient relationship. Always consult a licensed healthcare provider for clinical evaluation and treatment. If you are in crisis, call or text <strong>988</strong>.</div>
    <button class="btn-start" onclick="waamBegin()">Begin WAAM&#8482; Assessment &#8594;</button>
  </div>`;
}

function waamBegin(){curSec=0;startTimer();render();}

function renderSec(dom){
  const isFirst=curSec===0,isLast=curSec===DOMAINS.length-1;
  document.getElementById("waamMain").innerHTML=`
  <div class="sec-meta">
    <span class="sec-meta-label">Section ${curSec+1} of ${DOMAINS.length}</span>
    <span class="sec-meta-line"></span>
    <span class="sec-meta-title">WAAM-${dom.abbr}&#8482;</span>
  </div>
  <div class="sec-card">
    <div class="sec-hdr">
      <div class="sec-icon" style="background:${dom.iconBg}">${dom.icon}</div>
      <div>
        <div class="sec-title">${dom.name}</div>
        <div class="sec-abbr" style="color:${dom.accentColor}">WAAM-${dom.abbr}&#8482; Module</div>
        <div class="sec-instr">Respond based on your genuine experience — there are no right or wrong answers.</div>
      </div>
    </div>
    <div class="sec-body">
      <div class="sec-prompt" style="border-color:${dom.accentColor}">${dom.prompt}</div>
      ${dom.qs.map((q,qi)=>renderQ(q,qi,dom)).join("")}
    </div>
  </div>
  <div class="nav-row">
    ${!isFirst?`<button class="btn-nav" onclick="waamPrevSec()">&#8592; Back</button>`:`<span></span>`}
    <button class="btn-nav btn-nav-p" onclick="waamNextSec()" id="waamNextBtn">${isLast?"Submit for Analysis &#8594;":"Continue &#8594;"}</button>
  </div>`;
  // Scroll to top of the assessment widget
  document.getElementById("waam-root").scrollIntoView({behavior:"smooth",block:"start"});
}

function renderQ(q,qi,dom){
  const n=qi+1;let inp="";
  const c=dom.accentColor;
  if(q.type==="l4"||q.type==="l5"){
    const sel=answers[q.id];
    inp=`<div class="likert" id="q_${q.id}">${q.l.map((lbl,i)=>`<div class="lk-opt${sel===i?" sel":""}" style="${sel===i?`background:${c};border-color:${c}`:`border-color:#E0E8E0`}" onclick="waamSetA('${q.id}',${i},this,'lk','${c}')"><span class="n">${i}</span><span class="l">${lbl}</span></div>`).join("")}</div>`;
  }else if(q.type==="l3"){
    const sel=answers[q.id];
    inp=`<div class="likert" id="q_${q.id}">${q.l.map((lbl,i)=>`<div class="lk-opt${sel===i?" sel":""}" style="flex:1;${sel===i?`background:${c};border-color:${c}`:`border-color:#E0E8E0`}" onclick="waamSetA('${q.id}',${i},this,'lk','${c}')"><span class="n">${i}</span><span class="l">${lbl}</span></div>`).join("")}</div>`;
  }else if(q.type==="pills"){
    const sel=answers[q.id];
    inp=`<div class="pills" id="q_${q.id}">${q.opts.map((o,i)=>`<div class="pill${sel===i?" sel":""}" style="${sel===i?`background:${c};border-color:${c};color:white`:`border-color:#E0E8E0`}" onclick="waamSetA('${q.id}',${i},this,'pill','${c}')">${o}</div>`).join("")}</div>`;
  }else if(q.type==="textarea"){
    inp=`<textarea id="q_${q.id}" placeholder="${q.placeholder||""}" oninput="answers['${q.id}']=this.value">${answers[q.id]||""}</textarea>`;
  }
  const critStyle=q.critical?`background:#FFF5F5;border:1.5px solid #F0C0C0;border-radius:10px;padding:12px 14px;`:``;
  return `<div class="q-block" style="${critStyle}">
    <div class="q-lbl"><span class="q-num" style="background:${dom.iconBg};color:${c}">${n}</span><span>${q.t}</span></div>
    ${inp}<div class="val-msg" id="val_${q.id}">Please select a response to continue.</div></div>`;
}

function waamSetA(qid,val,el,type,color){
  answers[qid]=val;
  const c=document.getElementById("q_"+qid);
  if(!c)return;
  c.querySelectorAll(type==="pill"?".pill":".lk-opt").forEach(e=>{e.classList.remove("sel");e.style.background="white";e.style.borderColor="#E0E8E0";e.style.color="";});
  el.classList.add("sel");el.style.background=color;el.style.borderColor=color;el.style.color="white";
  const v=document.getElementById("val_"+qid);if(v)v.classList.remove("show");
}

function waamNextSec(){
  const dom=DOMAINS[curSec];let ok=true;
  dom.qs.forEach(q=>{
    if(q.type==="textarea")return;
    const v=document.getElementById("val_"+q.id);
    if(answers[q.id]===undefined||answers[q.id]===null||answers[q.id]===""){if(v)v.classList.add("show");ok=false;}
    else{if(v)v.classList.remove("show");}
  });
  if(!ok){document.querySelector("#waam-root .val-msg.show")?.scrollIntoView({behavior:"smooth",block:"center"});return;}
  curSec++;render();
}
function waamPrevSec(){if(curSec>0){curSec--;render();}}

function computeWWAM(){
  const domScores={};
  DOMAINS.filter(d=>d.id!=="CX"&&d.max>0).forEach(dom=>{
    let raw=0;
    dom.qs.forEach(q=>{
      if(q.type==="textarea")return;
      const idx=answers[q.id];
      if(idx!==undefined&&idx!==null&&q.w){raw+=q.w[idx]||0;}
    });
    const pct=Math.round((raw/dom.max)*100);
    const burden=Math.min(pct,100);
    const weighted=burden*dom.weight;
    domScores[dom.id]={raw,pct,burden,weighted,dom};
  });

  let totalWeighted=0,totalWeight=0;
  Object.values(domScores).forEach(d=>{totalWeighted+=d.weighted;totalWeight+=d.dom.weight;});
  const rawWWS=totalWeight>0?Math.round(100-(totalWeighted/totalWeight)):50;

  let amplifier=1.0;
  const d1=domScores["D1"]?.pct||0,d2=domScores["D2"]?.pct||0,d3=domScores["D3"]?.pct||0;
  if(d1>60&&d3>60)amplifier+=0.08;
  if(d1>60&&d2>60)amplifier+=0.06;
  if(d2>60&&d3>60)amplifier+=0.05;
  if(d1>70&&d2>70&&d3>70)amplifier+=0.06;
  const wws=Math.max(0,Math.min(100,Math.round(rawWWS/amplifier)));

  const tier=WWS_TIERS.find(t=>wws>=t.min)||WWS_TIERS[WWS_TIERS.length-1];
  return{domScores,wws,tier};
}

function sevClass(pct){return pct<25?"0":pct<50?"1":pct<75?"2":"3";}
function sevLabel(pct){return SEV_LABELS[parseInt(sevClass(pct))];}

async function renderResults(){
  clearInterval(timerInt);
  const{domScores,wws,tier}=computeWWAM();
  const activeDoms=DOMAINS.filter(d=>d.id!=="CX"&&d.max>0);

  document.getElementById("waamMain").innerHTML=`
  <div class="res-hdr">
    <div style="font-size:32px;margin-bottom:12px">&#10003;</div>
    <h2 class="res-title">Your WAAM&#8482; Results</h2>
    <p class="res-sub">WAAM Index&#8482; scored. WAAM Clinical Engine&#8482; is generating your personalized analysis.</p>
  </div>
  <div class="wws-card">
    <div class="wws-label">WHOLE WELLNESS SCORE&#8482; (WWS&#8482;)</div>
    <div class="wws-score">${wws}</div>
    <div class="wws-tier">${tier.label}</div>
    <div class="wws-bar-wrap"><div class="wws-bar" id="wwsBar" style="width:0%"></div></div>
    <div class="wws-range"><span>0 &mdash; Acute Need</span><span>100 &mdash; Flourishing</span></div>
    <p style="font-size:13px;opacity:0.8;margin-top:14px;line-height:1.6">${tier.desc}</p>
  </div>
  <div class="score-grid">
    ${activeDoms.map(dom=>{
      const sc=domScores[dom.id];const cls=sevClass(sc.pct);const sl=sevLabel(sc.pct);
      return`<div class="score-card">
        <div class="sc-abbr sev-${cls}">WAAM-${dom.abbr}&#8482;</div>
        <div class="sc-name">${dom.name}</div>
        <div class="sc-bar-w"><div class="sc-bar bar-${cls}" style="width:0%" id="bar_${dom.id}"></div></div>
        <div class="sc-val sev-${cls}">${sc.pct}<span style="font-size:13px;font-weight:400">/100</span></div>
        <div class="sc-sev">${sl[0]} &mdash; ${sl[1]}</div>
      </div>`;}).join("")}
  </div>
  <div class="ai-card">
    <div class="ai-card-hdr"><span style="font-size:18px">&#129504;</span><h3>WAAM Clinical Engine&#8482; Analysis</h3></div>
    <div class="ai-card-body">
      <div class="loading-w" id="aiLoad"><div class="spinner"></div><div class="loading-t">WAAM Clinical Engine&#8482; analyzing your profile<span class="ldots"></span></div><div style="font-size:12px;color:var(--mid);margin-top:8px">This takes 20–35 seconds</div></div>
      <div id="aiRes" style="display:none"></div>
    </div>
  </div>`;

  setTimeout(()=>{
    document.getElementById("wwsBar").style.width=wws+"%";
    activeDoms.forEach(dom=>{
      const b=document.getElementById("bar_"+dom.id);
      if(b)b.style.width=domScores[dom.id].pct+"%";
    });
  },200);

  await runAI(domScores,wws,tier);
}

async function runAI(domScores,wws,tier){
  const scores=Object.values(domScores).map(s=>`${s.dom.name} (WAAM-${s.dom.abbr}™): ${s.pct}/100 burden — ${sevLabel(s.pct)[0]}`).join("\n");
  const ctx={age:answers["cx1"]||"not specified",dx:answers["cx2"]||"not specified",therapy:answers["cx3"]||"not specified",duration:answers["cx4"]||"not specified",concern:answers["cx5"]||"none provided"};

  const prompt=`You are the WAAM Clinical Engine™ — the AI analysis component of the Wholistically Aligned Assessment Method (WAAM™), developed under board-certified doctoral Psychiatric Mental Health Nurse Practitioner (PMHNP) clinical oversight. You provide clinically informed, educational wellness analysis based on proprietary WAAM™ multi-domain assessment scores.

WAAM INDEX™ SCORES:
Whole Wellness Score (WWS™): ${wws}/100 — ${tier.label}
${scores}

PERSONAL CONTEXT:
- Age: ${ctx.age}
- Previous diagnosis: ${ctx.dx}
- Current treatment: ${ctx.therapy}
- Duration of symptoms: ${ctx.duration}
- Primary concern: ${ctx.concern}

Generate a comprehensive WAAM™ Clinical Engine™ analysis in six sections. Use clinically informed, warm, PMHNP-authored language. Be specific to this person's score profile — do not give generic advice. Frame all clinical content as educational psychoeducation, not diagnosis.

## CLINICAL PICTURE
In 3–4 sentences, describe the overall clinical presentation suggested by these WAAM™ scores. Name the most clinically significant domains. Describe how the domains interact and amplify each other (e.g., how sleep disruption and mood interact, how anxiety feeds somatic symptoms). Use clinical language: "patterns consistent with..." rather than "you have..."

## CLINICAL PRESENTATIONS WORTH EXPLORING WITH A PROVIDER
Based on this WAAM™ score pattern, list 3–5 clinical presentations a PMHNP or psychiatrist would likely consider in a formal evaluation. For each, give one sentence on how the scores support this consideration. Frame as: "This score pattern is consistent with presentations that clinicians might explore, including..."

## THERAPEUTIC PATHWAY RECOMMENDATIONS
Recommend 4–5 evidence-based therapy modalities tailored to this specific WAAM™ profile. For each:
- Name and acronym
- One sentence: what it does and why it fits this specific profile
- Which WAAM™ domains it most directly addresses

## NUTRACEUTICAL & SUPPLEMENT PROTOCOL
Recommend 5–7 evidence-supported natural supplements or nutraceuticals relevant to the highest-burden domains. For each:
- Name, form, and general dosage range
- Specific research support (what the evidence shows)
- Which WAAM™ domains it targets
- Any important provider consultation notes (interactions, contraindications)

## LIFESTYLE MODIFICATION PLAN
Give 5–6 specific, actionable, science-backed lifestyle changes targeting the highest-burden WAAM™ domains. Make these concrete, measurable, and genuinely personalized to this score profile — not generic wellness tips.

## WAAM™ ENCOURAGEMENT & NEXT STEPS
2–3 sentences of warm, genuine clinical encouragement. Then list exactly 4 numbered next steps for this week, including one that references connecting with a licensed professional if scores warrant it.

Format with the exact section headers above. Be specific, warm, and genuinely clinical. Do not add a disclaimer at the end.`;

  try{
    const res=await fetch(WAAM_PROXY_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:2000,messages:[{role:"user",content:prompt}]})});
    if(!res.ok)throw new Error(`Proxy responded with status ${res.status}`);
    const data=await res.json();
    const text=data.content?.[0]?.text||"";
    document.getElementById("aiLoad").style.display="none";
    document.getElementById("aiRes").style.display="block";
    document.getElementById("aiRes").innerHTML=formatAI(text);
  }catch(e){
    document.getElementById("aiLoad").style.display="none";
    document.getElementById("aiRes").style.display="block";
    document.getElementById("aiRes").innerHTML=`<div style="text-align:center;padding:32px;color:var(--mid)"><div style="font-size:26px;margin-bottom:12px">&#9888;&#65039;</div><div>AI analysis unavailable. Please check that the proxy URL is configured correctly.</div><div style="font-size:12px;margin-top:8px;color:var(--coral)">${e.message}</div></div>`;
  }
}

const AI_SECS={
  "CLINICAL PICTURE":{icon:"&#128269;",color:"var(--ocean)",bg:"var(--ocean-lt)"},
  "CLINICAL PRESENTATIONS WORTH EXPLORING WITH A PROVIDER":{icon:"&#128203;",color:"var(--plum)",bg:"var(--plum-lt)"},
  "THERAPEUTIC PATHWAY RECOMMENDATIONS":{icon:"&#128172;",color:"var(--teal)",bg:"var(--teal-lt)"},
  "NUTRACEUTICAL & SUPPLEMENT PROTOCOL":{icon:"&#127807;",color:"var(--sage)",bg:"var(--sage-lt)"},
  "LIFESTYLE MODIFICATION PLAN":{icon:"&#9889;",color:"var(--gold)",bg:"var(--gold-lt)"},
  "WAAM&#8482; ENCOURAGEMENT & NEXT STEPS":{icon:"&#10024;",color:"var(--teal)",bg:"var(--teal-lt)"},
};

function formatAI(text){
  const parts=text.trim().split(/^##\s+/m).filter(p=>p.trim());
  return parts.map(part=>{
    const title=part.split("\n")[0].trim().replace(/[*]/g,"").toUpperCase().replace(/WAAM&#8482;|WAAM™/g,"WAAM™");
    const content=part.split("\n").slice(1).join("\n").trim();
    const cfg=Object.entries(AI_SECS).find(([k])=>title.includes(k))?.[1]||{icon:"&#128204;",color:"var(--teal)",bg:"var(--teal-lt)"};
    const disp=part.split("\n")[0].trim().replace(/[*]/g,"");
    const rows=content.split("\n").map(l=>{
      l=l.trim();if(!l)return"";
      if(l.startsWith("- ")||l.startsWith("• "))return`<li>${l.slice(2).replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>")}</li>`;
      return`<p>${l.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>")}</p>`;
    }).join("");
    const html=rows.includes("<li>")?rows.replace(/(<li>.*?<\/li>)+/gs,m=>`<ul style="padding-left:18px;margin:8px 0">${m}</ul>`):rows;
    return`<div class="ai-sec"><div class="ai-sec-hdr" style="background:${cfg.bg}"><span style="font-size:16px">${cfg.icon}</span><span class="ai-sec-title" style="color:${cfg.color}">${disp}</span></div><div class="ai-content">${html}</div></div>`;
  }).join("");
}

render();
</script>
