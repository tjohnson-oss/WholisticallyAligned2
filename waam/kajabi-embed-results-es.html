<div id="waam-embed-wrap">
  <iframe id="waam-frame"
          src="https://waam-engine.wholisticallyaligned.workers.dev/es?tier=results"
          title="WAAM Results"
          style="width:100%;border:0;display:block;min-height:700px"
          scrolling="no"
          allow="clipboard-write"></iframe>
</div>
<script>
(function(){
  var ORIGIN = "https://waam-engine.wholisticallyaligned.workers.dev";
  var frame  = document.getElementById("waam-frame");
  var wrap   = document.getElementById("waam-embed-wrap");

  // This page is the post-purchase destination, so tier is fixed in the src
  // above rather than read from the URL — Kajabi's offer redirect cannot carry
  // a query string. If the buyer also enrolled, ?tier=enrolled on THIS page is
  // still honoured and upgrades what is shown.
  try {
    var tier = new URLSearchParams(window.location.search).get("tier");
    if (tier === "enrolled") frame.src = ORIGIN + "/es?tier=enrolled";
  } catch (e) {}

  window.addEventListener("message", function(e){
    if (e.origin !== ORIGIN) return;
    var d = e.data;
    if (!d || d.waam !== true) return;

    if (d.type === "height" && d.h > 0) {
      frame.style.height = d.h + "px";
      return;
    }
    var top = wrap.getBoundingClientRect().top + window.pageYOffset;
    if (d.type === "scrollTop") {
      window.scrollTo({ top: top, behavior: "smooth" });
    } else if (d.type === "scrollTo" && typeof d.y === "number") {
      window.scrollTo({ top: top + d.y, behavior: "smooth" });
    }
  });
})();
</script>
